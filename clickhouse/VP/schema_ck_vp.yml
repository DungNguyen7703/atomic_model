version: 2

models:
  - name: vp_fct_investor_group_trading_snpst_flat
    description: "[MOI 2026-10-29] Flat table ClickHouse — Fact Investor Group Trading Snapshot x Calendar Date x Security Trading Snapshot Dim x Industry Dim. Grain = 1 dong / ma CK|hop dong / ngay GD / san / investor_group_code / src_stm_code. Partition by cdr_dt (Date, derive tu snpst_dt_dim_id, khong NULL)."
    config:
      materialized: incremental_rebase
      incremental_strategy: ck_snapshot
      partition_by: ['ds_snpst_dt']
      file_format: "{{ var('file_format') }}"
      schema: "{{ var('ck_schema') }}"
    tags:
      - layer::clickhouse
      - concept::fact
      - domain::vp

