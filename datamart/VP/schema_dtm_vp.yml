version: 2

models:
  - name: dtm_fct_investor_group_trading_snpst
    description: "[MOI 2026-10-27, O_VP_37 2026-10-29] Datamart model của bảng Fact Investor Group Trading Snapshot - GD theo nhóm nhà đầu tư (ALL / FOREIGN / PROPRIETARY), 1 dòng / mã CK|hợp đồng / ngày GD / sàn / investor_group_code / src_stm_code. Nguồn ORDERTRADE HOSE + HNX, market_id IN (STK,STX,UPX,DVX). Nhóm KHÔNG loại trừ nhau. industry_dim_id chỉ cho cổ phiếu (stock_tp_code='2'), CTCK/CTQLQ mặc định '07000', NULL cho phái sinh/CCQ/chứng quyền."
    config:
      materialized: incremental_rebase
      incremental_strategy: append
      partition_by: ["snpst_dt_dim_id"]
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("dtm_schema") }}'
      alias: 'fct_investor_group_trading_snpst'
      tags:
        - layer_datamart
        - domain_vp

  - name: dtm_fct_listed_corporate_bond_snpst
    description: "[MOI 2026-10-28] Datamart model của bảng Fact Listed Corporate Bond Snapshot - snapshot TPDN niêm yết cuối ngày, 1 dòng / mã TP (ISIN) / ngày GD. FULL OUTER JOIN Sổ lệnh HNX (HCX) và bản tin MDDS (stock_tp='1'). Ngành theo CTPH, CTCK/CTQLQ mặc định '07000'."
    config:
      materialized: incremental_rebase
      incremental_strategy: append
      partition_by: ["snpst_dt_dim_id"]
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("dtm_schema") }}'
      alias: 'fct_listed_corporate_bond_snpst'
      tags:
        - layer_datamart
        - domain_vp

  - name: dtm_fct_private_corporate_bond_registration_snpst
    description: "[MOI 2026-10-28] Datamart model của bảng Fact Private Corporate Bond Registration Snapshot - danh sách TPDN riêng lẻ đăng ký GD theo tháng báo cáo HNX, 1 dòng / mã TP / tháng. Factless (không có measure). Chỉ nạp khi etl_date = ngày cuối tháng báo cáo (O_VP_27)."
    config:
      materialized: incremental_rebase
      incremental_strategy: append
      partition_by: ["snpst_dt_dim_id"]
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("dtm_schema") }}'
      alias: 'fct_private_corporate_bond_registration_snpst'
      tags:
        - layer_datamart
        - domain_vp

  - name: dtm_fct_private_corporate_bond_trading_snpst
    description: "[MOI 2026-10-28] Datamart model của bảng Fact Private Corporate Bond Trading Snapshot - GD TPDN riêng lẻ theo ngày báo cáo HNX09, 1 dòng / ngày, toàn thị trường. Pivot row_path → cột (trading_val, foreign_buy/sell_val). Nguồn ICP, trạng thái SUBMITTED/LATE_SUBMITTED."
    config:
      materialized: incremental_rebase
      incremental_strategy: append
      partition_by: ["snpst_dt_dim_id"]
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("dtm_schema") }}'
      alias: 'fct_private_corporate_bond_trading_snpst'
      tags:
        - layer_datamart
        - domain_vp

  - name: dtm_fct_listed_equity_snpst
    description: "[MOI 2026-10-29] Datamart model của bảng Fact Listed Equity Snapshot - snapshot cổ phiếu/CCQ niêm yết cuối ngày, 1 dòng / mã (stock_tp_code 2/3/6) / ngày GD. Nguồn MDDS_JAD_STOCKINFOR, floor_code IN ('02','04','10'). Mỗi ETL load 2 partition: ngày D + ngày D-1 (để điền VWAP từ bản tin D, O_VP_40). Vốn hóa chỉ tính cho stock_tp_code='2'; UPCoM dùng VWAP thay close_price."
    config:
      materialized: incremental_rebase
      incremental_strategy: append
      partition_by: ["snpst_dt_dim_id"]
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("dtm_schema") }}'
      alias: 'fct_listed_equity_snpst'
      tags:
        - layer_datamart
        - domain_vp

  - name: dtm_fct_government_bond_trading_snpst
    description: "[MOI 2026-10-29] Datamart model của bảng Fact Government Bond Trading Snapshot - GD TP Chính phủ theo ngày GD và loại sổ lệnh, 1 dòng / ngày / order_book_type (OUTRIGHT | REPO). Nguồn HNX_OUTRIGHT_ORDER_BOOK + HNX_REPO_ORDER_BOOK, loại REPO2 bị loại. order_status='ĐTH'. Giá trị GD: OUTRIGHT→trading_value, REPO→first_settlement_value (O_VP_32)."
    config:
      materialized: incremental_rebase
      incremental_strategy: append
      partition_by: ["snpst_dt_dim_id"]
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("dtm_schema") }}'
      alias: 'fct_government_bond_trading_snpst'
      tags:
        - layer_datamart
        - domain_vp

  - name: dtm_fct_derivative_contract_snpst
    description: "[MOI 2026-10-27] Datamart model của bảng Fact Derivative Contract Snapshot - snapshot cuoi ngay hop dong phai sinh, 1 dong / ma hop dong / ngay GD. FULL OUTER JOIN gia dong cua MDDS (floor_code='03') va OI VSDC (END_OF_DAY_OPEN_INTEREST)."
    config:
      materialized: incremental_rebase
      incremental_strategy: append
      partition_by: ["snpst_dt_dim_id"]
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("dtm_schema") }}'
      alias: 'fct_derivative_contract_snpst'
      tags:
        - layer_datamart
        - domain_vp
