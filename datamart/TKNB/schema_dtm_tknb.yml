        - layer_datamart
        - domain_tknb

  - name: dtm_fct_security_trading_detail_snpst
    description: "Datamart model của bảng Fact Security Trading Detail Snapshot (TKNB Nhóm 28) — thay thế BM035. Grain: 1 dòng/symbol/trading_dt, mọi sàn."
    config:
      materialized: incremental_rebase
      incremental_strategy: append
      partition_by: ["snpst_dt_dim_id"]
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("dtm_schema") }}'
