  - name: dtm_depository_member_dim
    description: "Datamart model của bảng Depository Member Dimension (TKNB Nhóm 13 TTLK01). Grain: 1 dòng/Thành viên lưu ký (TVLK), BK = depository_member_nm (SCD4A current-state)."
    config:
