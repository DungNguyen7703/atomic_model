  - name: dtm_fct_derivatives_security_detail_snpst
    description: "Datamart model của bảng Fact Derivatives Security Detail Snapshot (TKNB Nhóm 29) — thay thế BM043. Grain: 1 dòng/symbol HĐTL (floor_code = '03')/trading_dt."
    config:
      materialized: incremental_rebase
