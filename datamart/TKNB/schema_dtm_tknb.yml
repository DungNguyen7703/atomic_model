    description: "Datamart model của bảng Fact Covered Warrant Outstanding Snapshot (TKNB Nhóm 14 TTLK10) — thay thế dtm_ttlk10_cw_outstanding_rpt. Grain: 1 dòng/mã chứng quyền HOSE/ngày giao dịch."
    config:
