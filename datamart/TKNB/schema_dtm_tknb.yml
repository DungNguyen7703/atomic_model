  - name: dtm_government_bond_term_dim
    description: "Datamart model của bảng Government Bond Term Dimension (TKNB, HNX BM 25). Grain: 1 dòng/kỳ hạn nguyên văn (bond_term) của đợt đấu thầu TPCP (SCD4A current-state)."
    config:
