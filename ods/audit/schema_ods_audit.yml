version: 2

models:
  - name: ods_audit_af_approval
    description: "ODS model của bảng AUDIT.AF_APPROVAL"
    config:
      materialized: incremental_rebase
      incremental_strategy: snapshot
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("ods_audit_schema") }}'
      alias: 'af_approval'
      tags:
        - layer_ods
        - domain_audit

