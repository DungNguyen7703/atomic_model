version: 2

models:

  - name: ods_tms_compliance_report_structure
    description: "ODS model của bảng TMS.COMPLIANCE_REPORT_STRUCTURE"
    config:
      materialized: incremental_rebase
      incremental_strategy: snapshot
      partition_by: ["ds_snpst_dt"]
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("ods_tms_schema") }}'
      alias: 'compliance_report_structure'
      tags:
        - layer_ods
        - domain_tms

  - name: ods_tms_compliance_report_value
    description: "ODS model của bảng TMS.COMPLIANCE_REPORT_VALUE"
    config:
      materialized: incremental_rebase
      incremental_strategy: append
      partition_by: ["data_dt"]
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("ods_tms_schema") }}'
      alias: 'compliance_report_value'
      tags:
        - layer_ods
        - domain_tms
