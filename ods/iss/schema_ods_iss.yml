version: 2

models:
  - name: ods_iss_flat_report
    description: "ODS model tổng hợp dữ liệu báo cáo ISS đã flatten theo field/metric (master table, join input_report + submission + template + template_sheet + fact_report_data + flat_metric_tree, giải nén JSON theo posexplode/explode)"
    config:
      materialized: incremental_rebase
      incremental_strategy: snapshot
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("ods_iss_schema") }}'
      alias: 'flat_report'
      tags:
        - layer_ods
        - domain_iss

  - name: ods_iss_internal_statistical_report
    description: "ODS model tổng hợp dữ liệu báo cáo ISS đã flatten theo field/metric (master table, join input_report + submission + template + template_sheet + fact_report_data + flat_metric_tree, giải nén JSON theo posexplode/explode)"
    config:
      materialized: incremental_rebase
      incremental_strategy: append
      partition_by: ["data_dt"]
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("ods_iss_schema") }}'
      alias: 'INTERNAL_STATISTICAL_REPORT'
      tags:
        - layer_ods
        - domain_iss

  - name: ods_iss_flat_metric_tree
    description: "Flatten cay chi tieu INPUT_REPORT_METRIC (JOIN INPUT_REPORT_TEMPLATE_SHEET + INPUT_REPORT_TEMPLATE, mo phong CONNECT BY cua Oracle bang self-join level-by-level) - khong co bang nguon that, doc thang tu 3 raw source va tu tinh lai cay"
    config:
      materialized: incremental_rebase
      incremental_strategy: append
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("ods_iss_schema") }}'
      alias: 'flat_metric_tree'
      tags:
        - layer_ods
        - domain_iss
